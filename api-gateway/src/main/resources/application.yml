server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # JWT and role filters are attached per-route below: public routes simply
      # omit them, which keeps whitelisting declarative and reviewable.
      #
      # ORDERING RULE: literal path segments (/me, /mine, /*/status,
      # /*/candidates, /*/decision) must be declared BEFORE the catch-all
      # "/**" route for the same prefix, otherwise the {id} pattern swallows them.
      routes:
        # ---------- AUTH SERVICE ----------
        - id: auth-public
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/register,/api/auth/login

        - id: auth-admin
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/users,/api/auth/users/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN

        - id: patient-admin-list
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/api/patients
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN

        - id: patient-admin-detail
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/api/patients/{id}/status
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN

        - id: auth-me
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/me,/api/auth/me/**
          filters:
            - Jwt

        # ---------- PATIENT SERVICE ----------
        # (internal/** is called service-to-service via Eureka, not through the gateway)
        # list + status routes above are ADMIN-only; everything else under /patients is PATIENT self-service
        - id: patient-secure
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/api/patients/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,PATIENT

        # ---------- DOCTOR SERVICE ----------
        # "me" routes must be declared BEFORE the public /api/doctors/** route,
        # because {id} path variables would otherwise swallow "/me".
        - id: doctor-me
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/doctors/me,/api/doctors/me/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: DOCTOR

        - id: doctor-public
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/doctors,/api/doctors/**
          filters:
            - StripPrefix=0

        # ---------- APPOINTMENT SERVICE ----------
        - id: appointment-secure
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/appointments,/api/appointments/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT

        # ---------- NOTIFICATION SERVICE ----------
        # Every authenticated role gets a notification feed, including the two
        # domain-operator roles added for blood banking and organ donation.
        - id: notification-secure
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications,/api/notifications/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,BLOOD_BANK_OFFICER,TRANSPLANT_COORDINATOR

        # ================= BLOOD BANK SERVICE =================
        # Domain roles: ADMIN, DOCTOR, PATIENT, BLOOD_BANK_OFFICER.
        # TRANSPLANT_COORDINATOR is deliberately absent — the two domains are
        # separate bounded contexts with separate operators.
        - id: bloodbank-metadata
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/metadata,/api/bloodbank/compatibility/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,BLOOD_BANK_OFFICER

        # Availability is the narrow, patient-safe projection of stock.
        - id: bloodbank-availability
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/availability
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,BLOOD_BANK_OFFICER

        # a requester's own history (literal "mine" before the /** catch-all)
        - id: bloodbank-requests-mine
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/requests/mine
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,BLOOD_BANK_OFFICER

        # only staff decide a request
        - id: bloodbank-request-decision
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/requests/*/decision
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,BLOOD_BANK_OFFICER

        # raise / read-one / cancel — ownership is enforced inside the service
        - id: bloodbank-requests
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/requests,/api/bloodbank/requests/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,BLOOD_BANK_OFFICER

        # full stock detail (thresholds, expiry, lot history) is staff-only
        - id: bloodbank-inventory
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/inventory,/api/bloodbank/inventory/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,BLOOD_BANK_OFFICER

        # any authenticated role may register ITSELF as a donor (row keyed by caller id)
        - id: bloodbank-donors-me
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/donors/me
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,BLOOD_BANK_OFFICER

        # the donor registry is staff-only
        - id: bloodbank-donors-registry
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/donors,/api/bloodbank/donors/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,BLOOD_BANK_OFFICER

        - id: bloodbank-stats
          uri: lb://BLOODBANK-SERVICE
          predicates:
            - Path=/api/bloodbank/stats
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,BLOOD_BANK_OFFICER

        # ================= ORGAN DONATION SERVICE =================
        # Domain roles: ADMIN, DOCTOR, PATIENT, TRANSPLANT_COORDINATOR.
        - id: organs-metadata
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/metadata
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT,TRANSPLANT_COORDINATOR

        # a patient's own pledge, updated by consent
        - id: organs-pledges-me
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/pledges/me,/api/organs/pledges/me/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT

        # registry reads and verification are coordinator-only
        - id: organs-pledges-registry
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/pledges,/api/organs/pledges/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,TRANSPLANT_COORDINATOR

        # a patient's own waitlist entries
        - id: organs-waitlist-mine
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/waitlist/mine
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT

        # the ranked candidate view exposes donor identities — coordinator-only
        - id: organs-waitlist-candidates
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/waitlist/*/candidates
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,TRANSPLANT_COORDINATOR

        # allocation decisions
        - id: organs-waitlist-status
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/waitlist/*/status
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,TRANSPLANT_COORDINATOR

        # list a patient / read the board — clinicians (a PATIENT uses /mine)
        - id: organs-waitlist
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/waitlist,/api/organs/waitlist/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,TRANSPLANT_COORDINATOR

        # a participant's own allocations
        - id: organs-matches-mine
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/matches/mine
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,PATIENT

        # propose / advance allocations and read the whole book — coordinator-only
        - id: organs-matches
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/matches,/api/organs/matches/**
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,TRANSPLANT_COORDINATOR

        - id: organs-stats
          uri: lb://ORGAN-DONATION-SERVICE
          predicates:
            - Path=/api/organs/stats
          filters:
            - Jwt
            - name: RoleAuth
              args:
                allowedRoles: ADMIN,DOCTOR,TRANSPLANT_COORDINATOR

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    # Default is 30s — after a cold start the gateway would 503 on the first
    # calls until its registry cache refreshed. 5s keeps demos glitch-free.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

medicore:
  jwt:
    secret: ${JWT_SECRET:medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
    clock-skew-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
