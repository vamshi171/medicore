name: MediCore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Maven verify (JUnit/Mockito)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test all services
        run: mvn -B clean verify

  frontend:
    name: Frontend — React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: medicore-frontend
        run: |
          npm install
          npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package backend jars
        run: mvn -B -DskipTests clean package

      - name: Build all Docker images
        run: |
          for svc in service-registry api-gateway auth-service patient-service doctor-service appointment-service notification-service bloodbank-service organ-donation-service; do
            docker build -t medicore/$svc:latest $svc
          done
          docker build -t medicore/frontend:latest medicore-frontend
