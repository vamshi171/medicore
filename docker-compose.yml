name: medicore (standalone repos)
#
# Prerequisites (no Docker-in-Docker):
#  1. Build every backend jar first (localhost Maven + JDK 17):
#        cd medicore-common && mvn clean install           # common lib
#        cd ../medicore-service-registry && mvn clean package
#        cd ../medicore-auth-service && mvn clean package
#        cd ../medicore-patient-service && mvn clean package
#        cd ../medicore-doctor-service && mvn clean package
#        cd ../medicore-appointment-service && mvn clean package
#        cd ../medicore-notification-service && mvn clean package
#        cd ../medicore-api-gateway && mvn clean package
#     (Each POM depends on medicore-common; install it first so Maven finds it.)
#  2. Build the frontend static assets (localhost Node 20):
#        cd medicore-frontend && npm install && npm run build
#  3. Then run:
#        docker compose up
#     MySQL + Eureka + 5 services + gateway + Nginx-served frontend.
#
# Tip: `docker compose up -d` runs detached; `docker compose down` tears it down.
# Tip: the frontend Dockerfile runs `npm ci` (package-lock.json is committed), so the
#      assets built outside Docker are NOT used by the container — the container builds
#      its own. If you want the container to serve locally-built assets, replace the
#      frontend Dockerfile with a no-build stage that COPYs ./dist instead.
version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: medicore_auth
      MYSQL_USER: medicore
      MYSQL_PASSWORD: medicore123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  service-registry:
    build: ./medicore-service-registry
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy

  auth-service:
    build: ./medicore-auth-service
    ports:
      - "8081:8081"   # Swagger UI per service
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  patient-service:
    build: ./medicore-patient-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  doctor-service:
    build: ./medicore-doctor-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  appointment-service:
    build: ./medicore-appointment-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  notification-service:
    build: ./medicore-notification-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  bloodbank-service:
    build: ./medicore-blood-bank-service
    ports:
      - "8086:8086"
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  organ-donation-service:
    build: ./medicore-organ-donation-service
    ports:
      - "8087:8087"
    environment:
      DB_HOST: mysql
      DB_USER: medicore
      DB_PASSWORD: medicore123
      EUREKA_URI: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-medicore-internal-dev-token}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

  api-gateway:
    build: ./medicore-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
    depends_on:
      service-registry:
        condition: service_started
      auth-service:
        condition: service_started

  frontend:
    build: ./medicore-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
