server:
  port: 8081

spring:
  application:
    name: AUTH-SERVICE
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/medicore_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:medicore}
    password: ${DB_PASSWORD:medicore123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

medicore:
  jwt:
    secret: ${JWT_SECRET:medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
    ttl-minutes: 60
  internal-token: ${INTERNAL_TOKEN:medicore-internal-dev-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
